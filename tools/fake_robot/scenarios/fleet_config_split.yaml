# 로봇 두 대가 서로 다른 코드로 돌고 있다 — 로드맵 10 이 잡으려는 상태.
#
# "데모가 어제는 됐는데 오늘 안 된다" 의 원인 대부분이 이것이다. 한 대만
# 배포가 안 됐거나, 한 대에서 손으로 고친 것을 커밋하지 않았거나, 맵을 새로
# 뜬 뒤 한 대만 갈아끼웠거나.
#
# 확인할 것 (backend/app/fleet_config.py)
#   1. 커밋이 갈리면 '몇 대 몇' 이 그대로 보인다
#   2. 맵은 이름이 아니라 지문으로 비교한다 — 같은 이름의 다른 맵을 잡는다
#   3. 커밋 안 된 변경(dirty)이 드러난다. 해시만으로 재현이 불가능한 상태다
#   4. 보고하지 않은 팔(omx-*)은 불일치가 아니라 '모른다' 로 남는다
#
# 실기로 이 상태를 만들려면 로봇 한 대에만 다른 브랜치를 배포하고 재기동해야
# 한다. 그건 확인 한 번에 20분이다.

name: 형상 불일치 (커밋·맵이 갈린 2대)

robots:
  - id: pinky-01
    type: mobile
  - id: pinky-02
    type: mobile

steps:
  # 정상 배포된 로봇.
  - robot: pinky-01
    action: inventory
    commit: a1b2c3d4e5f6
    branch: main
    map_name: yun_map_highres_clean
    map_hash: 7c9f1a2b3c4d

  # 배포가 안 된 채 남은 로봇. 게다가 현장에서 손으로 고쳤다(dirty).
  # 맵도 다른 것을 물고 있다 — 이름은 같고 지문만 다르다.
  - robot: pinky-02
    action: inventory
    commit: 999999999999
    branch: hotfix/nav-timeout
    dirty: true
    map_name: yun_map_highres_clean
    map_hash: ffffffffffff
