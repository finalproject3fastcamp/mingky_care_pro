[pytest]
# tests/ 가 `from app...` 로 임포트한다. 이게 없으면 저장소 루트에서든
# backend/ 에서든 PYTHONPATH 를 손으로 넘겨야 수집이 된다.
pythonpath = . ..
testpaths = tests

# ROS 환경(/opt/ros/*)이 source 된 셸에서는 launch_testing 이 pytest11 진입점으로
# 자동 로드되다가 lark 부재로 수집 자체가 죽는다. 이 저장소 테스트는 ROS 런치를
# 쓰지 않으므로 해당 플러그인만 끈다.
#
# e2e 는 기본 실행에서 뺀다. 진짜 PostgreSQL 과 uvicorn 이 필요해서, DB 없이
# 도는 것이 나머지 테스트의 계약이다. 돌리려면 `pytest -m e2e`.
addopts = -p no:launch_testing -p no:launch_ros -m "not e2e"

markers =
    e2e: 진짜 DB·백엔드·가짜 로봇을 붙여 배관 전체를 통과시킨다
