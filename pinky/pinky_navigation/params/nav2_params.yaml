amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # 10cm 도착 허용 범위보다 늦게 보정하면 실제로 도착하고도 AMCL 좌표가
    # 남아 있거나 한 번에 튈 수 있다. Pi 5 부하를 과도하게 늘리지 않는
    # 범위에서 작은 로봇의 5cm 이동과 약 3도 회전도 위치 보정에 반영한다.
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # 충전소 좌표를 정답으로 가정하지 않는다. auto_localize_node가 현재
    # LiDAR와 맵을 비교해 유일한 후보를 찾았을 때만 /initialpose를 발행한다.
    set_initial_pose: false
    # lifecycle 재시작 때 이전 pose를 조용히 재사용하지 않고 새로 검증된
    # /initialpose를 기다린다. 잘못된 위치가 재시작으로 되살아나는 것을 막는다.
    always_reset_initial_pose: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    # Pi 5가 카메라·QR과 동시에 동작할 때 20ms 안에 action goal ACK를
    # 못 보내 정상 목표가 취소됐다. 계산 결과 제한과 별개인 통신 여유다.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # --- 시스템 기본 설정 ---
    /bond_disable_heartbeat_timeout: true    # 라이프사이클 노드 간 상태 체크(하트비트) 타임아웃 무시 여부

    # ==========================================================
    # 1. 주행 컨트롤러 (MPPI) 파라미터
    # ==========================================================
    # 안내 주행과 Waypoint 시험주행은 모두 FollowPath를 사용한다. MPPI가
    # 2초 앞의 여러 속도 궤적을 비교해 새로 들어온 LiDAR 장애물을 정지 후
    # 복구로 넘기기 전에 우선 우회한다. Pi 5의 지속 부하를 낮추기 위해
    # 10 Hz에서 20개 시점과 200개 표본만 평가한다.
    FollowPath:
      # Smac2D 경로의 진행 방향이 로봇 자세와 크게 다르면 MPPI에 넘기기 전
      # 제자리에서 정렬한다. XY 목표에 들어오면 최종 yaw도 Shim이 맡아,
      # 위치 이동과 최종 방향 점수가 충돌해 미세 전진하는 교착을 막는다.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.52
      angular_disengage_threshold: 0.17
      forward_sampling_distance: 0.15
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.5
      max_cost_threshold: 254.0
      simulate_ahead_time: 0.5
      rotate_to_goal_heading: true
      # 후진을 막은 상태에서 재계획 경로가 로봇 뒤로 바뀌면 MPPI가 큰 원을
      # 그리지 않도록, 새 경로마다 진행 방향을 다시 확인하고 필요하면
      # 제자리 회전한 뒤 전진한다.
      rotate_to_heading_once: false
      closed_loop: true
      use_path_orientations: false

      # Rotation Shim이 초기·최종 회전만 담당하고, 실제 경로 추종과 동적
      # 장애물 회피는 기존 MPPI가 그대로 수행한다. Jazzy Shim은 내부
      # controller를 같은 FollowPath namespace로 구성하므로 파라미터도 같은
      # 단계에 둔다.
      time_steps: 20
      model_dt: 0.1
      batch_size: 200
      iteration_count: 1
      ax_max: 2.5
      ax_min: -2.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.2
      vx_std: 0.10
      vy_std: 0.0
      wz_std: 0.25
      vx_max: 0.20
      # 안내·Waypoint 주행은 후진하지 않는다. 뒤쪽으로 경로를 바꿔야 해도
      # 제자리 회전한 다음 전진한다.
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      prune_distance: 1.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.8
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # 멀리서 최종 yaw를 맞추느라 목표 위치로 가지 못하는 교착을 막는다.
        # XY 허용 범위 밖에서는 경로 추종을 우선하고, 최종 회전은 Shim이 맡는다.
        threshold_to_consider: 0.10
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 12
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.8
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.4

    # ==========================================================
    # 2. 컨트롤러 서버 공통 설정
    # ==========================================================
    controller_plugins: ["FollowPath"]           # 메인 주행 플러그인 (위에서 설정한 이름)
    controller_frequency: 10.0                   # [Hz] 제어 명령(cmd_vel)을 1초에 10번 내보내 Pi 5 부하를 제한
    action_server_result_timeout: 10.0           # [s] 액션 서버 결과 대기 최대 시간
    autostart_node: false                        # 노드 켤 때 자동 활성화 여부
    bond_heartbeat_period: 0.1                   # [s] 시스템 상태 체크(하트비트) 주기
    costmap_update_timeout: 0.3                  # [s] 코스트맵 업데이트가 이 시간 지연되면 멈춤
    enable_stamped_cmd_vel: false                # TwistStamped 메시지 대신 일반 Twist 메시지 사용
    failure_tolerance: 1.0                       # [s] 순간 센서 흔들림은 즉시 ABORTED로 만들지 않는다
    publish_zero_velocity: true                  # 목표 도달/취소 시 확실하게 정지하도록 0 속도 명령 발행
    speed_limit_topic: "speed_limit"             # 속도 제한 구역 적용 시 구독할 토픽 이름
    odom_topic: "odom"                           # 현재 속도를 읽어올 오도메트리 토픽
    use_realtime_priority: false                 # 리눅스 실시간(Realtime) 우선순위 사용 여부
    use_sim_time: false                          # 시뮬레이션 시간 사용 여부 (실제 로봇이므로 false)
    start_type_description_service: true         # 파라미터 타입 설명 서비스 활성화

    # 미세한 노이즈 속도는 0으로 간주하는 임계치
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5

    # ==========================================================
    # 3. 목표 도달 판별 (Goal Checker)
    # ==========================================================
    goal_checker_plugins: ["general_goal_checker"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.07                    # [m] 목표 중심 7cm 이내를 도착으로 인정한다
      yaw_goal_tolerance: 0.174533               # [rad] 목표 각도 오차 10도 이내를 도착으로 인정한다

    # ==========================================================
    # 4. 주행 진척도 검사 (Progress Checker)
    # ==========================================================
    # 로봇이 좁은 곳에 갇혔거나 끼었는지 판별하는 기능
    progress_checker_plugins: ["progress_checker"]

    progress_checker:
      # 소형 로봇이 코너에서 제자리 회전해도 진행으로 인정한다.
      plugin: "nav2_controller::PoseProgressChecker"
      movement_time_allowance: 4.0               # [s] 경로 정렬·코너 회전은 기다리고 실제 정체만 복구로 넘긴다
      required_movement_radius: 0.01             # [m] 1cm 이상 이동하면 정상 진행으로 인정
      required_movement_angle: 0.035             # [rad] 거리 이동이 없어도 제자리 회전 약 2도를 진행으로 인정


local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.01                    # global_costmap 과 맞춘다. 생략하면 Nav2 기본값 0.01 이지만 명시해 둔다
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025                          # 맵(yun_map_highres_clean)이 0.025 다. 굵으면 벽이 실제보다 두꺼워진다
      #robot_radius: 0.22
      footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # MPPI footprint 대각 반경(약 0.099m)을 간신히 넘기는 최소값이다.
        # 전역 경로의 0.08m는 유지해 좁은 통로 선택 특성은 바꾸지 않는다.
        inflation_radius: 0.10
      # 입력이 2D LaserScan뿐이므로 3D voxel 적재·발행 비용을 사용하지 않는다.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.01                    # 내접 0.06 + 0.01 = 하한 0.07m. 0.03 이면 하한 0.09m 라 자유 공간의 35% 가 통과 불가가 된다
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      #robot_radius: 0.22
      footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
      resolution: 0.025                          # 맵과 맞춘다
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.08
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # 전용 BT의 1Hz 재계획보다 충분히 빠르면서 Pi 5에 불필요한 20Hz
    # 성능 경고를 만들지 않는 기준이다.
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased", "Smac2D"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # 동적 장애물이 정확한 목표 셀을 잠시 덮어도 Controller의 7cm 도착
      # 허용범위 안에서 접근 가능한 셀을 찾아 우회 경로를 만들 수 있게 한다.
      tolerance: 0.07
      use_astar: false
      allow_unknown: true
    Smac2D:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.07
      allow_unknown: true
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
