twist_mux:
  ros__parameters:
    # twist_mux 는 기본이 TwistStamped 다. 켜두면 Nav2 도 모터 드라이버도
    # 붙지 못한다. nav2_params.yaml 의 enable_stamped_cmd_vel 이 false 이고
    # pinky_bringup 도 평범한 Twist 를 구독하므로 여기서 맞춘다.
    use_stamped: false

    # 우선순위가 높은 입력이 이긴다. 값이 같은 입력을 두지 않는다.
    #
    # timeout 은 "이 입력이 조용해지면 몇 초 뒤에 후보에서 빼는가" 이다.
    # 텔레옵이 끊겼을 때 주행 제어권이 Nav2 로 돌아오는 시간이기도 하다.
    #
    # 1.0 초인 이유. 텔레옵 명령은 혼잡한 공용 2.4GHz 를 건너온다. 사람이
    # 많은 시간대에는 500ms 대로 튀는데, 0.5 초면 그때마다 입력이 끊긴
    # 것으로 보고 로봇이 뚝뚝 선다. 원격 조작이 못 쓸 물건이 된다.
    #
    # 대신 진짜 끊겼을 때 더 간다. 텔레옵 상한이 0.15 m/s 라 1.0 초면 15cm 다.
    # 이 값을 올리려면 속도 상한을 같이 낮춰라.
    #
    # 비상정지는 여기 두지 않는다. mingky_battery_guard 의 emergency_stop 이
    # 이 뒤에서 단일 게이트로 막는다. 그쪽은 정지 상태를 파일에 남겨
    # 재부팅해도 유지되는데, twist_mux 의 lock 은 노드가 사는 동안만이라
    # 재시작하면 풀린다. 정지는 더 강한 쪽에 맡긴다.
    topics:
      teleop:
        topic: cmd_vel_teleop
        timeout: 1.0
        priority: 100

      # Nav2 의 velocity_smoother 출력.
      # navigation_launch.xml 에서 cmd_vel 로 리맵하지 않아야 여기로 들어온다.
      navigation:
        topic: cmd_vel_smoothed
        timeout: 1.0
        priority: 10

      # auto_localize_node 가 AMCL 초기 위치를 잡을 때 쓰는 소량 탐색 이동
      # (회전+전진/후진 왕복). 사람도 Nav2 경로계획도 아니라 별도 입력으로
      # 뺐다. teleop(100)보다 낮아 사람 조작이 항상 이긴다. manual lock(50)
      # 보다도 낮게 둬서, 사람이 몰고 있으면 이 입력도 같이 막힌다 -- 로봇이
      # 혼자 움직이면 안 된다.
      localize_probe:
        topic: cmd_vel_localize_probe
        timeout: 1.0
        priority: 20

    # lock 은 자기보다 우선순위가 **낮은** 입력을 막는다.
    #
    # manual 모드는 "사람이 몬다" 는 선언이다. 그런데 우선순위만으로는
    # 텔레옵 입력이 1 초 끊길 때마다 Nav2 가 제어권을 도로 가져간다.
    # 조작자가 잠깐 손을 뗀 사이 로봇이 스스로 목적지로 출발하는 셈이라,
    # 모드 표가 말하는 것과 실제 동작이 다르다.
    #
    # 우선순위 50 은 텔레옵(100)보다 낮고 Nav2(10)보다 높다. 그래서 이
    # lock 이 걸리면 **Nav2 만 막히고 텔레옵은 그대로 통과**한다.
    #
    # timeout 0.0 은 살아있음 검사를 하지 않는다는 뜻이다. mode_manager 가
    # 죽어도 마지막 값이 유지된다 — manual 로 걸어둔 채 노드가 죽으면
    # Nav2 가 자동으로 되살아나지 않는다. 사람이 몰던 상태에서 로봇이 갑자기
    # 스스로 움직이는 쪽이 더 위험하다.
    locks:
      manual:
        topic: manual_mode_lock
        timeout: 0.0
        priority: 50
