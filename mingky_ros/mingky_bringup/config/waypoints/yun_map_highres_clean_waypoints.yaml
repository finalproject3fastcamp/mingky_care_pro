# 병원 waypoint. 기준 맵은 map/yun_map_highres_clean.yaml 이다.
#
# 좌표는 맵에 종속적이다. 맵의 origin 이나 resolution 이 바뀌면 여기 값이
# 전혀 다른 물리 위치를 가리키므로, 맵을 교체하면 전부 다시 측정해야 한다.
# 이전 맵(map/archive/yun_map.yaml) 기준 좌표는
# config/waypoints/archive/yun_map_waypoints.yaml 에 참고용으로 남겼다.
#
# 측정
#     ros2 run mingky_bringup run_waypoint_teleop.sh
#     ros2 run mingky_bringup capture_waypoint.sh <이름>
#
# 검증 (측정 후 반드시)
#     ros2 run mingky_bringup check_waypoints.py
#
# 기준
#     벽에서 최소            0.15 m
#     서로 다른 목적지 간     0.30 m 이상
#     충전소                 도킹 지점이 아니라 앞 0.3 m
#
# 벽에 0.09 m 보다 가까우면 planner 가 도달하지 못한다. 그런데 NavFn 의
# tolerance 가 '근처까지만' 경로를 그려주기 때문에 에러 없이 조용히 실패하고,
# 로봇은 목표 앞에서 좌우로 회전하다 멈춘다.


# 재측정 체크리스트 (이전 맵 기준 이름)
#
#   [ ] reception_goal
#   [ ] payment_goal
#   [ ] reception_payment_waiting
#   [ ] pharmacy_goal
#   [ ] pharmacy_waiting
#   [ ] treatment_room_goal
#   [ ] treatment_room_waiting
#   [ ] xray_room_goal
#   [ ] xray_room_waiting
#   [ ] ct_room_goal
#   [ ] ct_room_waiting
#   [ ] mri_room_goal
#   [ ] mri_room_waiting
#   [ ] clinical_pathology_room_goal
#   [ ] clinical_pathology_room_waiting
#   [ ] physical_therapy_goal
#   [ ] physical_therapy_waiting
#   [ ] ward_goal
#   [ ] ward_waiting
#   [ ] restroom_goal
#   [ ] restroom_waiting
#   [ ] charging_station_1
#   [ ] charging_station_2
#
# _goal 과 _waiting 을 정말 나눠야 하는지 먼저 판단할 것.
# 이전 맵에서 두 지점 간격이 0.127~0.262 m 였는데, 로봇 자체가 0.12 m 라
# 그 정도 물러남은 의미가 없고 tolerance 안에 들어 로봇이 움직이지 않았다.
# 나눌 거면 0.30 m 이상 벌리고, 아니면 하나로 합쳐라.

waypoints:
  reception_goal:
    x: 0.016590
    y: 0.334153
    yaw: -1.515395
