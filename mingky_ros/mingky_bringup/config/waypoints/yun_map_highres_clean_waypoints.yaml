# 병원 waypoint. 기준 맵은 map/yun_map_highres_clean.yaml 이다.
#
# 좌표는 맵에 종속적이다. 맵의 origin 이나 resolution 이 바뀌면 여기 값이
# 전혀 다른 물리 위치를 가리키므로, 맵을 교체하면 전부 다시 측정해야 한다.
# 이전 맵(map/archive/yun_map.yaml) 기준 좌표는
# config/waypoints/archive/yun_map_waypoints.yaml 에 참고용으로 남겼다.
#
# 측정
#     ros2 run mingky_bringup run_waypoint_teleop.sh
#     ros2 run mingky_bringup capture_waypoint.sh <이름>
#
# 검증 (측정 후 반드시)
#     ros2 run mingky_bringup check_waypoints.py
#
# 기준 (회전된 12x12cm 차체 외곽부터 측정)
#     차체-벽 차단            점유 셀과 겹침(0.00 m)
#     차체-벽 경고            0.02 m 미만
#     서로 다른 목적지 간     0.14 m 이상
#     충전소                 도킹 지점이 아니라 앞 0.3 m
#
# 관제 Waypoint Check와 check_waypoints.py가 같은 기준을 사용한다. 0~2cm
# 경고 지점은 시험 주행할 수 있으며 실제 충돌 여부는 Nav2가 최종 판정한다.


# 재측정 체크리스트 (이전 맵 기준 이름)
#
#   [ ] reception_goal
#   [ ] payment_goal
#   [ ] reception_payment_waiting
#   [ ] pharmacy_goal
#   [ ] pharmacy_waiting
#   [ ] treatment_room_goal
#   [ ] treatment_room_waiting
#   [ ] xray_room_goal
#   [ ] xray_room_waiting
#   [ ] ct_room_goal
#   [ ] ct_room_waiting
#   [ ] mri_room_goal
#   [ ] mri_room_waiting
#   [ ] clinical_pathology_room_goal
#   [ ] clinical_pathology_room_waiting
#   [ ] physical_therapy_goal
#   [ ] physical_therapy_waiting
#   [ ] ward_goal
#   [ ] ward_waiting
#   [ ] restroom_goal
#   [ ] restroom_waiting
#   [ ] charging_station_1
#   [ ] charging_station_2
#
# _goal 과 _waiting 을 정말 나눠야 하는지 먼저 판단할 것.
# 이전 맵에서 두 지점 간격이 0.127~0.262 m 였는데, 로봇 자체가 0.12 m 라
# 그 정도 물러남은 의미가 없고 tolerance 안에 들어 로봇이 움직이지 않았다.
# 나눌 거면 0.30 m 이상 벌리고, 아니면 하나로 합쳐라.

# DB session_steps.visit_name 과 이 맵의 Nav2 waypoint 를 연결한다.
# 검사실 표시 이름이 바뀌면 좌표 이름을 추측하지 말고 이 매핑을 함께 고친다.
visit_waypoints:
  X-ray:
    goal: xray_room_goal
    waiting: xray_room_waiting
  임상병리실:
    goal: clinical_pathology_room_goal
    waiting: clinical_pathology_room_waiting
  물리치료실:
    goal: physical_therapy_goal
    waiting: physical_therapy_waiting
  CT:
    goal: ct_room_goal
    waiting: ct_room_waiting
  MRI:
    goal: mri_room_goal
    waiting: mri_room_waiting

