/**:
  ros__parameters:
    # /dev/videoN 은 연결 순서에 따라 바뀌므로 카메라의 고정 by-id 경로를 쓴다.
    video_device: /dev/v4l/by-id/usb-Jieli_Technology_USB_Composite_Device-video-index0
    pixel_format: YUYV
    # 환자 YOLO 추론과 관제 미리보기에 색상 정보가 필요하다.
    output_encoding: bgr8
    image_size: [640, 480]
    camera_frame_id: rear_camera_optical_frame
    # 캘리브레이션 뒤 file:// URL로 교체한다.
    camera_info_url: ""
