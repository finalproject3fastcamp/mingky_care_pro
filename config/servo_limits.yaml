# 서보가 뜨겁다고 볼 기준 (monitoring-spec.md §4.4, 로드맵 11).
#
# Dynamixel 은 온도·전류·전압·하드웨어 에러 비트를 스스로 보고한다. 로봇은
# 그 값을 그대로 올리고, "몇 도부터 문제인가" 는 여기서 정한다 —
# duplicate_node_severity.yaml · topic_watch.yaml 과 같은 이유로 임계를
# 바꾸려고 로봇을 재배포하지 않는다.
#
# ---------------------------------------------------------------------------
# 실측 전 잠정값이다.
#
# XM430 의 기본 온도 상한(Temperature Limit)은 80℃ 이고 넘으면 서보가 스스로
# 토크를 끊는다. 그 지점은 이미 사이클이 깨진 뒤이므로 경고선을 그 아래에
# 둔다. 55/65 는 여유를 크게 잡은 초안이고, 정상 조제 회차의 실측 분포가
# 나오면 다시 잡는다 — §13 의 "팔 SLI 기준선" 과 같은 항목이다.
#
# ---------------------------------------------------------------------------
# 필드
#
#   warn_temp_c        이 이상이면 따뜻하다. 화면에만 표시하고 알리지 않는다
#   hot_temp_c         이 이상이면 manipulator.servo_overheat 를 발행한다
#   rising_c_per_hour  추세가 이보다 가파르면 '오르는 중' 으로 본다.
#                      지금 온도와 별개다 — 40℃ 라도 회차마다 오르면 신호다
#   warn_current_ma    지속 부하 경고선(절대값). 순간 피크가 아니라 표본값이다
#
# 조인트별로 다르게 잡을 수 있다. 그리퍼는 물건을 쥔 채 버티는 시간이 길어
# 다른 조인트보다 뜨겁게 도는 것이 정상이다.
# ---------------------------------------------------------------------------

default:
  warn_temp_c: 55
  hot_temp_c: 65
  rising_c_per_hour: 4
  warn_current_ma: 1200

joints:
  # 쥐는 힘을 유지하는 동안 계속 전류가 흐른다. 다른 조인트와 같은 선을
  # 쓰면 정상 동작이 매 사이클 경고로 뜬다.
  gripper:
    warn_temp_c: 60
    hot_temp_c: 70
    warn_current_ma: 1500

  # 팔 전체 무게를 들고 버티는 축. 과부하 자세의 신호가 여기 먼저 나온다.
  shoulder_lift:
    warn_temp_c: 52
    hot_temp_c: 62
