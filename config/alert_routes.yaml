# 화면 밖으로 나가는 사건 (monitoring-spec.md §8.4, 로드맵 12).
#
# 원칙 4 — 대시보드에만 있고 아무도 안 보는 지표는 없는 것과 같다. 심각한
# 사건은 사람이 보고 있지 않을 때도 도착해야 한다.
#
# ---------------------------------------------------------------------------
# 등급을 아껴 쓴다 (§8.4)
#
#   page    즉시 사람을 부른다. 환자가 옆에 있거나 로봇이 이미 멈춘 상태다
#   notify  알아야 하지만 뛰어갈 일은 아니다. 근무 중에 확인하면 된다
#
# page 를 늘리는 순간 알림 전체가 무시된다. 여기 있는 셋이 상한이라고 보고,
# 넷째를 넣고 싶으면 기존 하나를 내리는 쪽을 먼저 생각한다.
#
# **확률적 실패는 절대 넣지 않는다.** manipulator.pick_failed 는 모방학습에서
# 정상 동작 범위이고(§4.4), 정본에서도 warning 이다. 그걸 알림으로 내보내면
# 하루에 수십 번 울리고 그 순간부터 아무도 이 채널을 안 본다.
#
# ---------------------------------------------------------------------------
# 문구를 여기 두는 이유
#
# 코드 이름(robot.comm_lost)만 보내면 받는 사람이 저장소를 열어야 뜻을 안다.
# 임계·심각도와 같은 이유로 문구도 서버 설정이다 — 고치는 데 배포가 필요하면
# 결국 아무도 안 고친다.
# ---------------------------------------------------------------------------

# 같은 (로봇, 코드) 를 이 시간 안에 다시 보내지 않는다. comm_lost 가 흔들리는
# 로봇 하나가 채널을 도배하는 것을 막는다.
throttle_sec: 300

# 이보다 오래된 사건은 보내지 않는다.
#
# 게이트웨이는 두절 동안 이벤트를 SQLite 에 쌓았다가 복구되면 몰아 보낸다
# (§3.2). 그 배치에는 10분 전 사건이 들어 있고, 그걸 지금 알리면 사람이
# 지금 벌어지는 일로 읽는다. **지난 일을 현재형으로 알리지 않는다.**
max_age_sec: 300

# 한 배치에서 내보낼 상한. 복구 직후 몰려 들어온 배치가 알림 수십 건이 되면,
# 그 안에 있는 진짜 한 건을 아무도 못 찾는다.
max_per_batch: 5

codes:
  # ── page — 즉시 사람을 부른다 ─────────────────────────────────────────
  fire.detected:
    tier: page
    text: 화재 감지 — 대피 안내가 시작됩니다

  robot.estop_engaged:
    tier: page
    text: 비상정지가 걸렸습니다 — 스스로 풀리지 않습니다

  robot.comm_lost:
    tier: page
    text: 로봇과 통신이 끊겼습니다

  # ── notify — 알아야 하지만 뛰어갈 일은 아니다 ────────────────────────
  robot.battery_low:
    tier: notify
    text: 배터리가 운영선 아래로 내려갔습니다

  manipulator.servo_fault:
    tier: notify
    text: 서보가 하드웨어 에러를 보고했습니다

  manipulator.servo_overheat:
    tier: notify
    text: 서보가 과열 임계를 넘었습니다

  manipulator.cycle_aborted:
    tier: notify
    text: 조제 사이클을 포기했습니다 — 트레이 확인이 필요합니다

  # 유닛은 active 인데 데이터가 안 흐르는 상태(§7.2). 화면을 안 보고 있으면
  # 로봇이 멈춘 이유를 한참 뒤에 알게 된다.
  robot.topic_stale:
    tier: notify
    text: 토픽이 끊겼습니다 — 유닛은 살아 있습니다

  # 복구도 보낸다. 끊김만 보내면 채널에 나쁜 소식만 남아, 지금 상태가
  # 어떤지 알려면 결국 대시보드를 열어야 한다.
  robot.comm_restored:
    tier: notify
    text: 통신이 복구됐습니다
