# 로봇이 발행하는 이벤트의 정본 목록.
#
# 이 파일이 유일한 정본이다. 이벤트를 추가하려면 여기부터 고친다.
# 메시지 정의는 mingky_ros/mingky_interfaces/msg/Event.msg,
# 저장 스키마는 database/migrations/003_sessions_and_events.sql 에 있다.
#
# 수집 서버(FastAPI)가 기동 시 이 파일을 로드해 미등록 event_code 를 걸러낸다.
# payload 를 JSONB 로 저장하는 대신 DB 가 내용을 검증하지 않으므로,
# 검증 책임이 이 파일과 수집 서버에 있다.
#
# ---------------------------------------------------------------------------
# 작성 규칙
#
#   event_code   <영역>.<사건> 형식. 접두사로 필터링할 수 있어야 한다 (nav.%)
#   level        info | warning | error
#                ROS 측은 Event.msg 의 LEVEL_* 상수를 쓰고,
#                게이트웨이가 문자열로 변환해 전송한다
#   payload      JSON 객체. 담을 것이 없으면 {}
#                키 이름은 아래 공통 키를 우선 사용한다
#   applies_to   이 이벤트가 갱신하는 DB 컬럼. 없으면 로그 전용
#
# 공통 payload 키 (같은 개념에 다른 이름을 쓰지 않는다)
#   patient_id  visit_name  marker_id  step_order  reason  percent
#
# ---------------------------------------------------------------------------
# 수집 서버가 지켜야 할 것
#
#   1. 이벤트 적재와 상태 갱신을 같은 트랜잭션에 넣는다.
#      따로 커밋되면 이벤트만 남고 상태가 안 바뀌는 구멍이 생긴다.
#
#   2. 갱신은 멱등해야 한다.
#      재전송된 이벤트는 ON CONFLICT (event_id) DO NOTHING 으로
#      events 에는 안 들어가지만 UPDATE 는 한 번 더 실행된다.
#      조건절로 막는다:
#          UPDATE session_steps SET arrived_at = <occurred_at>
#          WHERE ... AND arrived_at IS NULL;
#
#   3. 배치는 occurred_at 순으로 정렬해 적용한다.
#      네트워크 두절 후 몰아 보내면 도착 순서가 발생 순서와 다를 수 있다.
#      session_steps 의 CHECK (completed_at IS NULL OR arrived_at IS NOT NULL)
#      가 안전망 역할을 하므로 이 제약을 완화하지 않는다.
#
#   4. 미등록 event_code 는 거부하지 말고 적재한 뒤
#      system.unknown_event_code 를 추가로 발행한다.
#      기록을 잃지 않으면서 문서 누락이 대시보드에 드러난다.
# ---------------------------------------------------------------------------


# === QR · 환자 인식 ==========================================================

qr.scan_ok:
  level: info
  payload: { patient_id: string }

qr.scan_failed:
  level: warning
  payload: { reason: string }

patient.lost:
  level: warning
  payload: { marker_id: int, last_seen_sec: float }
  # 안내 중(이동)일 때만 발행한다.
  # 대기 중 마커 소실은 환자가 방에 들어간 정상 상황이므로 이벤트가 아니다.
  # 같은 관측이라도 상태에 따라 의미가 다르므로,
  # 검출 노드가 아니라 상태를 소유한 노드가 판정한다.

patient.regained:
  level: info
  payload: { marker_id: int }


# === 주행 ===================================================================

nav.goal_sent:
  level: info
  payload: { visit_name: string }

nav.goal_succeeded:
  level: info
  payload: { visit_name: string }
  applies_to: session_steps.arrived_at

nav.goal_aborted:
  level: error
  payload: { visit_name: string, error_code: int }
  # error_code 는 Nav2 NavigateToPose 결과 코드를 그대로 넣는다.

nav.stuck:
  level: warning
  payload: { x: float, y: float }
  # progress checker 발동.


# === 세션 ===================================================================

session.started:
  level: info
  payload: { patient_id: string, marker_id: int }
  applies_to: guidance_sessions
  # 세션 행 생성 + examination_steps 를 session_steps 로 스냅샷 복사.

session.step_completed:
  level: info
  payload: { step_order: int, source: [qr, manual] }
  applies_to: session_steps.completed_at
  # source 는 completed_source 컬럼에 그대로 들어간다.
  # 자동 감지가 실제로 작동하는지 재는 지표이므로 반드시 채운다.
  # manual 비율이 높아지면 QR 인식이 고장난 것이다.
  # Phase 2 에서 마커 재검출을 추가하면 'marker' 가 늘고,
  # 003 의 completed_source CHECK 도 함께 넓혀야 한다.

session.ended:
  level: info
  payload: { end_reason: [completed, aborted, battery, patient_lost] }
  applies_to: guidance_sessions.ended_at


# === 로봇 활성화 (의료진 대시보드 → 로봇 arming) ============================
#
# 세션 시작 전에 의료진이 어떤 핑키를 쓸지 고르는 절차의 로그.
# 실시간 상태(=지금 armed 인가) 는 백엔드 인메모리 (app/arming.py) 가 소유하고,
# events 는 감사·타임라인용 히스토리만 남긴다. 화면 판정에 이 이벤트를 쓰지 않는다.

activation.armed:
  level: info
  payload: {}
  # 의료진이 로봇을 활성화. 발행 주체는 백엔드 (POST /robots/{id}/arm).

activation.canceled:
  level: info
  payload: { reason: string }
  # armed 해제. reason 은 'staff' (사용자 취소) 또는 'failsafe' (로봇 폴링 두절).

activation.consumed:
  level: info
  payload: {}
  # QR 스캔이 성공해 arming 이 실제 세션으로 이어짐. session_id 는 필드에 담긴다.


# === 로봇 상태 ==============================================================

robot.battery_low:
  level: warning
  payload: { percent: int }
  # 임계값을 넘은 순간만 남긴다.
  # 배터리 추이는 robot_battery_log 에 2분 주기로 따로 쌓는다.
  # 정기 샘플이 이벤트에 섞이면 타임라인 필터가 쓸모없어진다.

robot.comm_lost:
  level: error
  payload: {}

robot.paused:
  level: warning
  payload: { reason: string }


# === 시스템 =================================================================

system.unknown_event_code:
  level: error
  payload: { received_code: string }
  # 수집 서버가 미등록 코드를 받았을 때 발행한다.
  # 이 코드 자체는 반드시 등록되어 있어야 한다. 아니면 무한 루프가 난다.


# === OMX ====================================================================
#
# 조제 연동 방식이 확정되면 omx.* 접두사로 추가한다.
# 현재 주행 로봇과 로봇팔은 분리되어 있으므로 정의하지 않는다.
# 추가 시 session_id 를 채울지가 관건이다 —
# 조제가 특정 환자의 안내에 속하면 채우고, 독립적으로 돌면 0 이다.
