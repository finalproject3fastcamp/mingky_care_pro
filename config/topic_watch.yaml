# 토픽이 살아 있다고 볼 기준 (monitoring-spec.md §7.2, 로드맵 9).
#
# 실전 장애 모드는 "유닛은 active 인데 /scan 이 안 나오는 것" 이다. 라이다
# USB 가 죽어도 노드는 살아 있고 systemd 는 초록이다. 지금까지 그걸 보는
# 곳이 없었다.
#
# 판정을 로봇이 아니라 서버가 하는 이유는 duplicate_node_severity.yaml 과
# 같다 — 임계를 바꾸려고 로봇을 재배포하지 않는다. 로봇은 "마지막 수신이
# 몇 초 전이고 최근 주기가 몇 Hz 였다" 는 사실만 보고한다.
#
# ---------------------------------------------------------------------------
# 필드
#
#   expected_hz    정상 발행 주기. 화면 표시와 저하 판정의 기준이다
#   warn_sec       이 이상 안 오면 늘어진 것으로 본다
#   stale_sec      이 이상 안 오면 끊긴 것으로 본다 (always_on 이면 이벤트 발행)
#   min_hz_ratio   측정 Hz 가 expected_hz 의 이 비율 아래면 주기 저하로 본다.
#                  경과 시간만으로는 못 잡는 장애가 있다 — 라이다가 USB 대역
#                  부족으로 10Hz → 3Hz 가 되면 나이는 0.33초라 항상 정상이다
#   always_on      상시 발행되는가.
#                  false 면 끊겨도 이벤트를 발행하지 않는다. /cmd_vel 은 서
#                  있는 로봇에서 안 나오는 게 정상이고, 그걸 빨갛게 그리면
#                  대기 중인 로봇 2대가 항상 경고 상태가 된다
#   why            사람이 읽는 사유. 이 토픽이 끊기면 무엇이 안 되는가
#
# 여기 없는 토픽을 로봇이 보고하면 표시만 하고 판정하지 않는다. 정본에 없는
# 것을 서버가 임의 임계로 빨갛게 만들면 근거가 없다.
# ---------------------------------------------------------------------------

# 정본에 있는데 로봇 보고에 없으면 그것도 사실이다 — 감시 노드가 그 토픽을
# 아예 안 보고 있다는 뜻이라 "정상" 과 구분해서 표시한다.
default_min_hz_ratio: 0.5

topics:
  /scan:
    expected_hz: 10
    warn_sec: 1.0
    stale_sec: 3.0
    always_on: true
    why: 라이다가 멈추면 장애물 회피와 AMCL 갱신이 함께 멈춥니다

  /odom:
    expected_hz: 20
    warn_sec: 1.0
    stale_sec: 3.0
    always_on: true
    why: 오도메트리가 끊기면 Nav2 가 로봇 위치를 추정하지 못합니다

  # AMCL 은 파티클을 갱신할 때만 발행한다. 서 있는 로봇에서는 안 나오는 것이
  # 정상이므로 상시 감시 대상이 아니다. 대신 주행 중에 이게 오래 비면
  # 로컬라이제이션이 갱신되지 않고 있다는 신호다.
  /amcl_pose:
    expected_hz: 2
    warn_sec: 10.0
    stale_sec: 60.0
    always_on: false
    why: 주행 중에 끊기면 위치 추정이 갱신되지 않고 있습니다

  # 대기 중에는 발행되지 않는다. 주행 중인데 비어 있으면 컨트롤러가 명령을
  # 못 내고 있다는 뜻이다.
  /cmd_vel:
    expected_hz: 20
    warn_sec: 2.0
    stale_sec: 10.0
    always_on: false
    why: 주행 중에 끊기면 컨트롤러가 속도 명령을 내지 못하고 있습니다
