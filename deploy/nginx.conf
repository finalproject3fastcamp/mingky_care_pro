# WebSocket 업그레이드용. Upgrade 헤더가 없는 평범한 요청에는 Connection 을
# 비워야 keepalive 가 깨지지 않는다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # 실시간 조작이 이 경로로 WebSocket 을 연다 (routers/teleop.py).
        # 업그레이드 헤더를 넘기지 않으면 평범한 GET 이 되어 404 가 된다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 조작 소켓은 오래 열려 있다. 기본 60초면 가만히 있을 때 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 빌드 산출물은 내용 해시가 이름에 박혀 있다. 내용이 바뀌면 이름이 바뀌므로
    # 오래 캐시해도 낡은 것을 잡을 일이 없다.
    #
    # **여기에 index.html fallback 을 두지 않는다.** 없는 asset 에 HTML 을
    # 돌려주면 브라우저는 JS 자리에서 HTML 을 받고
    # "Expected a JavaScript module but the server responded with text/html"
    # 로 죽는다. 404 를 줘야 무엇이 없는지 그대로 드러난다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 어떤 asset 을 부를지를 담고 있다. 이것까지 캐시되면
    # 재배포 뒤에도 브라우저가 **사라진 이름의 asset** 을 계속 부른다.
    # 재배포할 때마다 강력 새로고침을 안내하는 대신 매번 확인하게 한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
