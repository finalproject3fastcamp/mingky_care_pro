name: mingky-care-server

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-mingky-init.sh:ro
      - ../database/migrations:/opt/mingky/migrations:ro
      - ../database/seeds/001_initial_data.sql:/opt/mingky/seeds/001_initial_data.sql:ro
      - ../database/seeds/002_robots.sql:/opt/mingky/seeds/002_robots.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SESSION_FAILURE_CANCEL_AFTER_SEC: ${SESSION_FAILURE_CANCEL_AFTER_SEC:-30}
      EVENT_CODES_FILE: /srv/mingky/config/event_codes.yaml
      WAYPOINTS_FILE: /srv/mingky/waypoints/yun_map_highres_clean_waypoints.yaml
      # 심각한 사건을 메신저로 내보낸다 (§8.4). 비어 있으면 꺼진 채로 돈다 —
      # 기본이 '안 보냄' 이라야 설정을 안 한 환경이 실수로 쏘지 않는다.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
