name: mingky-care-server

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-mingky-init.sh:ro
      - ../database/migrations:/opt/mingky/migrations:ro
      - ../database/seeds/001_initial_data.sql:/opt/mingky/seeds/001_initial_data.sql:ro
      - ../database/seeds/002_robots.sql:/opt/mingky/seeds/002_robots.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SESSION_FAILURE_CANCEL_AFTER_SEC: ${SESSION_FAILURE_CANCEL_AFTER_SEC:-30}
      EVENT_CODES_FILE: /srv/mingky/config/event_codes.yaml
      WAYPOINTS_FILE: /srv/mingky/waypoints/yun_map_highres_clean_waypoints.yaml
      # 심각한 사건을 메신저로 내보낸다 (§8.4). 비어 있으면 꺼진 채로 돈다 —
      # 기본이 '안 보냄' 이라야 설정을 안 한 환경이 실수로 쏘지 않는다.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # OMX 조제/포장 스테이션의 러너 주소. 각 OMX 박스가 클라우드로 역터널을
      # 걸어 자기 러너 포트를 host 의 127.0.0.1:2203x 에 노출하고, 백엔드는
      # 컨테이너 안에서 그 포트를 host.docker.internal 로 부른다(아래 extra_hosts).
      # 비어 있으면 원격 프록시를 쓰지 않고 기존 로컬/시뮬 동작 그대로다.
      MINGKY_OMX_DISPENSE_URL: ${MINGKY_OMX_DISPENSE_URL:-}
      MINGKY_OMX_PACK_URL: ${MINGKY_OMX_PACK_URL:-}
      # 원격 프록시(위 URL)로 조제하려면 이 값이 1 이어야 _dispense_worker 가
      # SIM 분기를 건너뛰고 _run_sequence→원격 러너로 간다.
      PHARMACY_REAL: ${PHARMACY_REAL:-0}
      PACK_REAL: ${PACK_REAL:-0}
    # 컨테이너의 127.0.0.1 은 컨테이너 자신이라, host 에 뜬 역터널 포트에 닿지
    # 못한다. host-gateway 로 host 를 가리켜 위 URL(host.docker.internal:2203x)이
    # 실제 host 의 터널 포트로 나가게 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
