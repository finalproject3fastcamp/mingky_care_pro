# 역터널이 망 전환·회선 끊김 뒤에 되살아나게 한다.
#
# 기본값(ClientAliveInterval 0)은 죽은 세션을 영원히 정리하지 않는다. 로봇이
# 다른 Wi-Fi 로 옮기면 옛 세션이 포워딩 포트를 계속 잡고 있고, 로봇이 새로
# 걸어온 터널은 ExitOnForwardFailure 로 바인딩에 실패해 무한 재시도한다.
# 결과적으로 로봇에 아무도 못 들어간다 — 공유기를 빼고 나면 복구 수단이 없다.
#
# 30초 × 3회 = 약 90초 안에 죽은 세션이 정리된다.
ClientAliveInterval 30
ClientAliveCountMax 3
